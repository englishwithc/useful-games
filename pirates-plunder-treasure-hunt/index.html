<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate's Plunder Treasure Hunt</title>
    <style>
        :root {
            --ocean-blue: #0077be;
            --sand-yellow: #f4d03f;
            --gold: #ffd700;
            --pirate-red: #c0392b;
            --card-back: #8e44ad;
        }

        body {
            background: radial-gradient(circle, var(--ocean-blue), #003366);
            color: white;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            text-shadow: 3px 3px 0px #000;
            font-size: 3rem;
            margin-top: 20px;
            color: var(--sand-yellow);
        }

        .game-controls {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 15px;
            border: 3px solid var(--sand-yellow);
            text-align: center;
        }

        .mode-toggle {
            cursor: pointer;
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            background: var(--sand-yellow);
            color: #000;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .mode-toggle:hover {
            transform: scale(1.1);
        }

        .mode-toggle.cursed {
            background: var(--pirate-red);
            color: white;
        }

        #status {
            font-size: 1.5rem;
            height: 2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 110px);
            grid-gap: 15px;
            perspective: 1000px;
            padding: 20px;
        }

        .card {
            width: 110px;
            height: 140px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s, opacity 0.5s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.faded {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5) rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 4px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .card-front {
            background: var(--card-back);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.1) 10px, rgba(255,255,255,0.1) 20px);
            color: white;
            font-weight: bold;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .card-back {
            transform: rotateY(180deg);
            background: white;
            font-size: 3.5rem;
        }

        .treasure-face { background: var(--gold); }
        .pirate-face { background: var(--pirate-red); }
        .empty-face { background: #ecf0f1; }

        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1); }
        }

        .winner-anim {
            animation: celebrate 0.5s infinite;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>🏴‍☠️ Pirate's Plunder 🏴‍☠️</h1>

    <div class="game-controls">
        <button id="modeBtn" class="mode-toggle">Mode: Classic</button>
        <div id="status">Find the Treasure!</div>
        <button id="resetBtn" class="mode-toggle" style="background: #fff;">Restart Game</button>
    </div>

    <div class="game-board" id="board"></div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const modeBtn = document.getElementById('modeBtn');
        const resetBtn = document.getElementById('resetBtn');

        let isCursedMode = false;
        let treasureIndex = -1;
        let pirates = [];
        let cards = [];
        let gameActive = true;

        function initGame() {
            gameActive = true;
            boardElement.innerHTML = '';
            statusElement.innerText = "Find the Treasure!";
            statusElement.style.color = "white";
            cards = [];
            
            const letters = ['A', 'B', 'C', 'D', 'E'];
            
            for (let i = 0; i < 25; i++) {
                // Calculate Coordinate (e.g., 0 = AA, 1 = AB, 5 = BA)
                const row = letters[Math.floor(i / 5)];
                const col = letters[i % 5];
                const coord = row + col;

                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                
                card.innerHTML = `
                    <div class="card-face card-front">${coord}</div>
                    <div class="card-face card-back"></div>
                `;
                
                card.addEventListener('click', () => handleCardClick(i));
                boardElement.appendChild(card);
                cards.push({ element: card, type: 'empty', isVisible: true });
            }

            setupPositions();
        }

        function setupPositions() {
            cards.forEach(c => c.type = 'empty');
            
            treasureIndex = Math.floor(Math.random() * 25);
            cards[treasureIndex].type = 'treasure';

            pirates = [];
            const pirateCount = isCursedMode ? 3 : 1;
            while (pirates.length < pirateCount) {
                let pIdx = Math.floor(Math.random() * 25);
                if (pIdx !== treasureIndex && !pirates.includes(pIdx)) {
                    pirates.push(pIdx);
                    cards[pIdx].type = 'pirate';
                }
            }
        }

        function handleCardClick(index) {
            if (!gameActive) return;

            const card = cards[index];
            const element = card.element;

            if (element.classList.contains('flipped') || element.classList.contains('faded')) return;

            element.classList.add('flipped');

            const backFace = element.querySelector('.card-back');

            if (card.type === 'treasure') {
                backFace.innerText = '💰';
                backFace.classList.add('treasure-face');
                winGame();
            } else if (card.type === 'pirate') {
                backFace.innerText = '🏴‍☠️';
                backFace.classList.add('pirate-face');
                triggerPirateEvent();
            } else {
                backFace.innerText = '💨';
                backFace.classList.add('empty-face');
                setTimeout(() => {
                    element.classList.add('faded');
                }, 600);
            }
        }

        function triggerPirateEvent() {
            statusElement.innerText = "OH NO! A PIRATE! Cards returned & Treasure moved!";
            statusElement.style.color = "var(--pirate-red)";
            
            gameActive = false; 

            setTimeout(() => {
                const fadedCards = cards.filter(c => c.element.classList.contains('faded'));
                const restoreCount = Math.min(5, fadedCards.length);
                
                for (let i = 0; i < restoreCount; i++) {
                    const randomFaded = fadedCards[Math.floor(Math.random() * fadedCards.length)];
                    randomFaded.element.classList.remove('flipped', 'faded');
                    randomFaded.element.querySelector('.card-back').className = 'card-face card-back';
                }

                const visibleIndices = cards
                    .map((c, i) => c.element.classList.contains('faded') ? -1 : i)
                    .filter(i => i !== -1);

                const newTreasureIdx = visibleIndices[Math.floor(Math.random() * visibleIndices.length)];
                
                cards.forEach(c => { if(c.type === 'treasure') c.type = 'empty'; });
                cards[newTreasureIdx].type = 'treasure';

                statusElement.innerText = "Keep hunting, matey!";
                statusElement.style.color = "white";
                gameActive = true;
            }, 2000);
        }

        function winGame() {
            gameActive = false;
            statusElement.innerText = "🎉 YOU FOUND THE GOLD! 🎉";
            statusElement.style.color = "var(--gold)";
            boardElement.classList.add('winner-anim');
        }

        modeBtn.addEventListener('click', () => {
            isCursedMode = !isCursedMode;
            modeBtn.innerText = isCursedMode ? "Mode: CURSED 💀" : "Mode: Classic";
            modeBtn.classList.toggle('cursed');
            initGame();
        });

        resetBtn.addEventListener('click', () => {
            boardElement.classList.remove('winner-anim');
            initGame();
        });

        initGame();
    </script>
</body>
</html>
